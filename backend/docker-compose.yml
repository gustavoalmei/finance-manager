services:
  postgres:
    image: postgres:18
    container_name: finance-manager-postgres
    restart: unless-stopped
    env_file:
      - ".env"
    ports:
      # bind só no loopback: Postgres não fica exposto na rede local
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
