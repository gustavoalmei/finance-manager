services:
  postgres:
    image: postgres:18
    container_name: finance-manager-postgres
    restart: unless-stopped
    env_file:
      - ".env"
    ports:
      # bind só no loopback: Postgres não fica exposto na rede local
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgres

volumes:
  postgres_data:
